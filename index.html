
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shine Electronic & Computer | NYC Premier Tech Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@700;800;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            purple: '#A020F0',
                            'purple-light': '#B861FF',
                            'purple-dark': '#7D12C4',
                            'light-bg': '#FDFDFF',
                        },
                        slate: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            900: '#0f172a',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Montserrat', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    animation: {
                        'float': 'float 8s ease-in-out infinite',
                        'pulse-slow': 'pulse 6s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'wave': 'wave 15s linear infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                            '50%': { transform: 'translateY(-20px) rotate(1deg)' },
                        },
                        wave: {
                            '0%': { transform: 'translateX(0) scale(1)' },
                            '50%': { transform: 'translateX(-5%) scale(1.1)' },
                            '100%': { transform: 'translateX(0) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FDFDFF;
            color: #0f172a;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Sophisticated Light Mesh Gradient Background with Purple hues */
        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: #FDFDFF;
            background-image: 
                radial-gradient(at 0% 0%, hsla(273, 100%, 96%, 1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(220, 100%, 97%, 1) 0, transparent 50%),
                radial-gradient(at 100% 100%, hsla(273, 100%, 95%, 1) 0, transparent 50%),
                radial-gradient(at 0% 100%, hsla(273, 100%, 96%, 1) 0, transparent 50%),
                radial-gradient(at 50% 50%, hsla(273, 100%, 98%, 1) 0, transparent 80%);
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(160, 32, 240, 0.08);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(160, 32, 240, 0.04);
        }

        .text-balance {
            text-wrap: balance;
        }

        .premium-shadow {
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.01),
                0 10px 15px -3px rgba(160, 32, 240, 0.03);
        }

        .premium-shadow-hover:hover {
            box-shadow: 
                0 20px 40px -10px rgba(0, 0, 0, 0.05),
                0 15px 30px -5px rgba(160, 32, 240, 0.08);
            border-color: rgba(160, 32, 240, 0.2);
            transform: translateY(-4px);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #FDFDFF;
        }
        ::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border: 2px solid #FDFDFF;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #A020F0;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
<body class="selection:bg-brand-purple/20 selection:text-brand-purple">
    <div class="bg-mesh"></div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
